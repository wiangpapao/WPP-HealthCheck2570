<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WPP HealthCheck 2570</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    #app { position:fixed; inset:0 auto auto 0; width:100%; height:100dvh;
           border:0; display:block; background:#f3f7f9; }
  </style>
</head>
<body>
  <iframe id="app" title="WPP HealthCheck" allow="clipboard-write"
          src="https://script.google.com/macros/s/AKfycbyKUnYoS-ZcHrw3jYLXGuS2nh13GLOpcbBzRlwnmDdIj_8SLI9-zCxua94kFXNPZA8i9g/exec"></iframe>
  <script>
    const app = document.getElementById('app');
    function fitToKeyboard() {
      const viewport = window.visualViewport;
      app.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
      app.style.height = (viewport ? viewport.height : window.innerHeight) + 'px';
    }
    fitToKeyboard();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitToKeyboard);
      window.visualViewport.addEventListener('scroll', fitToKeyboard);
    }
    window.addEventListener('orientationchange', fitToKeyboard);
  </script>
</body>
</html>
